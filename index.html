<style>
/* ============================================================
   tokens (Apple Music dark)
   ============================================================ */
:root {
  --bg: #000;
  --bg-2: #0c0c0c;
  --surface: #1c1c1e;
  --surface-2: #2c2c2e;
  --line: rgba(255,255,255,0.08);
  --line-strong: rgba(255,255,255,0.14);
  --fg: #ffffff;
  --fg-muted: #98989e;
  --fg-dim: #6c6c70;
  --accent: #fa233b;
  --accent-2: #fb5c74;
  --gradient: linear-gradient(135deg, #fa233b 0%, #fb5c74 100%);
  --gradient-strong: linear-gradient(135deg, #ff2d55 0%, #ff5c8a 50%, #ff8a5c 100%);
  --r-sm: 10px;
  --r: 14px;
  --r-lg: 22px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Pretendard Variable", Pretendard, system-ui, "Helvetica Neue", sans-serif;
  --font-serif: "Instrument Serif", "Times New Roman", Georgia, serif;
  --shadow-card: 0 24px 60px -20px rgba(0,0,0,0.6);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);

  /* iOS 26 Liquid Glass */
  --glass-bg: rgba(255,255,255,0.06);
  --glass-bg-strong: rgba(28,28,30,0.55);
  --glass-bg-thicker: rgba(28,28,30,0.72);
  --glass-border: rgba(255,255,255,0.14);
  --glass-blur: blur(34px) saturate(180%);
  --glass-shadow: 0 1px 0 rgba(255,255,255,0.12) inset,
                  0 -1px 0 rgba(0,0,0,0.18) inset,
                  0 18px 48px -16px rgba(0,0,0,0.55);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin:0; padding:0; height:100%; background:#000; }
body {
  font-family: var(--font);
  color: var(--fg);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
input { font: inherit; }

/* ============================================================
   app shell — phone-like
   ============================================================ */
.app {
  position: relative;
  width: 100%;
  max-width: 440px;
  height: 100dvh;
  margin: 0 auto;
  background: var(--bg);
  overflow: hidden;
  box-shadow: 0 0 80px rgba(0,0,0,0.6);
}

/* views */
.view {
  position: absolute;
  inset: 0;
  background: var(--bg);
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  transition: transform .42s cubic-bezier(.32,.72,0,1), opacity .42s ease;
  padding-bottom: calc(96px + var(--safe-bottom));
  will-change: transform;
}
.view-studio {
  z-index: 1; transform: translateX(0);
  background: var(--bg);
}
.view-playlist { z-index: 2; transform: translateX(100%); }
.app.show-playlist .view-studio { transform: translateX(-22%); opacity: .35; }
.app.show-playlist .view-playlist { transform: translateX(0); }

/* nav bar */
.navbar {
  position: sticky; top: 0;
  display: flex; align-items: center;
  height: calc(44px + var(--safe-top));
  padding: var(--safe-top) 8px 0;
  z-index: 20;
  background: rgba(0,0,0,0);
  transition: background .25s ease, backdrop-filter .25s ease, border-color .25s ease;
  border-bottom: 0.5px solid transparent;
}
.navbar.is-scrolled {
  background: var(--glass-bg-thicker);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border-bottom-color: var(--glass-border);
}
.nav-btn {
  width: 44px; height: 44px;
  display: grid; place-items: center;
  color: #fff;
  background: var(--glass-bg-strong);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 0.5px solid var(--glass-border);
  border-radius: 50%;
  box-shadow: 0 1px 0 rgba(255,255,255,0.12) inset, 0 6px 18px -4px rgba(0,0,0,0.4);
  margin-left: 8px;
}
.nav-btn:active { transform: scale(0.94); }
.nav-btn-right { margin-left: 0; margin-right: 8px; }
.nav-back-icon {
  width: 10px; height: 18px;
  border-left: 2.2px solid currentColor;
  border-bottom: 2.2px solid currentColor;
  transform: rotate(45deg);
  margin-left: 4px;
}
.nav-title {
  flex: 1;
  text-align: center;
  font-size: 17px;
  font-weight: 600;
  letter-spacing: -0.02em;
  opacity: 0;
  transform: translateY(4px);
  transition: opacity .25s ease, transform .25s ease;
}
.navbar.is-scrolled .nav-title { opacity: 1; transform: none; }
.nav-spacer { width: 60px; }
.nav-action {
  width: 44px; height: 44px;
  display: grid; place-items: center;
  color: var(--accent-2);
  font-size: 22px;
}

/* ============================================================
   studio view
   ============================================================ */
.studio-pad { padding: 4px 20px 32px; }

/* MOODmix wordmark */
.brand-hero {
  display: flex;
  align-items: center;
  gap: 14px;
  margin: 6px 0 24px;
}
.brand-mark {
  width: 48px; height: 48px;
  border-radius: 13px;
  background: linear-gradient(135deg, #fa233b 0%, #fb5c74 55%, #ff8a5c 100%);
  display: grid; place-items: center;
  position: relative;
  box-shadow: 0 0 32px rgba(251,92,116,0.4), 0 8px 24px -6px rgba(0,0,0,0.5);
  flex-shrink: 0;
}
.brand-mark::after {
  content: "";
  width: 18px; height: 18px;
  border-radius: 50%;
  background: rgba(10,10,10,0.95);
  box-shadow: inset 0 0 0 3.5px #fff;
}
.brand-name {
  font-family: var(--font-serif);
  font-size: 44px;
  font-weight: 400;
  line-height: 1;
  letter-spacing: -0.015em;
  color: var(--fg);
}
.brand-name em {
  font-style: italic;
  color: var(--fg-muted);
  font-weight: 400;
}
.tag-eyebrow {
  font-size: 12px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--accent-2);
  font-weight: 700;
  margin: 8px 0 6px;
}
.hero-title {
  font-size: 34px;
  font-weight: 700;
  line-height: 1.08;
  letter-spacing: -0.025em;
  margin: 0 0 8px;
}
.hero-title .alt { color: var(--fg-muted); display: block; }
.hero-sub {
  font-size: 15px;
  color: var(--fg-muted);
  line-height: 1.5;
  margin: 0 0 24px;
}

/* dropzone */
.dropzone {
  position: relative;
  aspect-ratio: 1/1;
  width: 100%;
  border-radius: var(--r-lg);
  background: var(--glass-bg-strong);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 0.5px solid var(--glass-border);
  box-shadow: var(--glass-shadow);
  overflow: hidden;
  display: grid; place-items: center;
  cursor: pointer;
  transition: transform .2s ease;
}
.dropzone:active { transform: scale(0.99); }
.dropzone.has-image { background: transparent; box-shadow: none; border-color: transparent; }
.dropzone.has-image .dz-inner { display: none; }
.dropzone img.preview {
  position: absolute; inset: 0;
  width: 100%; height: 100%; object-fit: cover; display: block;
}
.dz-inner {
  display: flex; flex-direction: column; align-items: center; gap: 12px;
}
.dz-icon {
  width: 56px; height: 56px; border-radius: 50%;
  background: rgba(255,255,255,0.08);
  display: grid; place-items: center;
  position: relative;
}
.dz-icon::before, .dz-icon::after {
  content: ""; position: absolute; background: #fff; border-radius: 2px;
}
.dz-icon::before { width: 22px; height: 2.5px; }
.dz-icon::after { width: 2.5px; height: 22px; }
.dz-title { color: var(--fg); font-size: 15px; font-weight: 500; }
.dz-hint { color: var(--fg-muted); font-size: 13px; margin-top: -6px; }

/* section heading */
.section-h {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.02em;
  margin: 32px 0 12px;
}

/* genre chips */
.genres {
  display: flex; gap: 8px;
  overflow-x: auto;
  margin: 0 -20px;
  padding: 4px 20px 8px;
  scrollbar-width: none;
}
.genres::-webkit-scrollbar { display: none; }
.genre {
  flex-shrink: 0;
  padding: 10px 18px;
  border-radius: 999px;
  background: var(--glass-bg-strong);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 0.5px solid var(--glass-border);
  color: var(--fg);
  font-size: 14px;
  font-weight: 500;
  white-space: nowrap;
  transition: transform .15s ease, background .15s ease;
}
.genre:active { transform: scale(0.96); }
.genre.is-active {
  background: var(--gradient);
  border-color: transparent;
  color: #fff;
  font-weight: 600;
}

/* mood sliders */
.mood-card {
  background: var(--glass-bg-strong);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 0.5px solid var(--glass-border);
  box-shadow: var(--glass-shadow);
  border-radius: var(--r);
  padding: 6px 16px;
  margin-top: 4px;
  transition: opacity .5s ease;
}
.mood-card.is-locked {
  opacity: 0.45;
  pointer-events: none;
}
.mood-row {
  display: grid;
  grid-template-columns: 86px 1fr 40px;
  align-items: center;
  gap: 12px;
  padding: 12px 0;
}
.mood-row + .mood-row { border-top: 0.5px solid var(--line); }
.mood-row label { font-size: 14px; color: var(--fg); }
.mood-row .val {
  font-size: 18px;
  line-height: 1;
  text-align: center;
  opacity: 0.35;
  transition: opacity .2s ease, transform .2s ease;
  filter: saturate(1.1);
}
input[type=range] {
  -webkit-appearance: none; appearance: none;
  width: 100%; height: 4px;
  border-radius: 999px;
  background: linear-gradient(to right, var(--accent-2) var(--p, 50%), rgba(255,255,255,0.15) var(--p, 50%));
  outline: none;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 18px; height: 18px;
  border-radius: 50%;
  background: #fff;
  cursor: pointer;
  box-shadow: 0 2px 6px rgba(0,0,0,0.4);
}

/* CTA */
.cta {
  width: 100%;
  padding: 16px;
  border-radius: 14px;
  background: var(--gradient);
  color: #fff;
  font-weight: 600;
  font-size: 17px;
  letter-spacing: -0.01em;
  margin-top: 32px;
  box-shadow: 0 10px 30px -10px rgba(250,35,59,0.55);
  transition: transform .15s ease, opacity .15s ease;
}
.cta:active:not(:disabled) { transform: scale(0.98); }
.cta:disabled {
  background: var(--surface);
  color: var(--fg-dim);
  box-shadow: none;
}

/* ============================================================
   playlist view
   ============================================================ */
.pl-hero {
  position: relative;
  margin-top: calc(-44px - var(--safe-top));
  min-height: 600px;
  background: var(--bg);
  overflow: hidden;
  isolation: isolate;
}
.pl-hero-bg {
  position: absolute;
  inset: -10px;
  background-position: center top;
  background-size: cover;
  transform: scale(1.04);
  filter: saturate(1.05);
  /* 사진이 아래로 갈수록 점점 사라져 검정 배경이 노출됨 */
  -webkit-mask-image: linear-gradient(180deg, #000 0%, #000 52%, transparent 90%);
          mask-image: linear-gradient(180deg, #000 0%, #000 52%, transparent 90%);
  z-index: 0;
}
.pl-hero-grad {
  position: absolute; inset: 0; z-index: 1;
  /* navbar 영역 가독성을 위한 상단 살짝 어둡게 */
  background: linear-gradient(180deg, rgba(0,0,0,0.32) 0%, rgba(0,0,0,0) 22%);
}
.pl-hero-content {
  position: relative; z-index: 2;
  padding: calc(84px + var(--safe-top)) 20px 26px;
  display: flex; flex-direction: column;
  min-height: 600px;
  justify-content: flex-end;
}
.pl-eyebrow {
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  font-weight: 700;
  color: rgba(255,255,255,0.78);
  text-shadow: 0 1px 8px rgba(0,0,0,0.4);
  margin-bottom: 10px;
}
.pl-title {
  font-size: 38px;
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1.02;
  margin: 0 0 10px;
  text-shadow: 0 2px 18px rgba(0,0,0,0.55);
  color: #fff;
}
.pl-byline {
  font-size: 14px;
  color: rgba(255,255,255,0.85);
  font-weight: 600;
  margin-bottom: 14px;
  letter-spacing: -0.01em;
  text-shadow: 0 1px 8px rgba(0,0,0,0.4);
}
.pl-desc {
  font-size: 14px;
  color: rgba(255,255,255,0.78);
  line-height: 1.5;
  margin: 0 0 14px;
  max-width: 100%;
  text-shadow: 0 1px 8px rgba(0,0,0,0.4);
}
.pl-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; }
.pl-tag {
  font-size: 12px;
  padding: 5px 11px;
  border-radius: 999px;
  background: var(--glass-bg-strong);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 0.5px solid var(--glass-border);
  color: #fff;
  font-weight: 500;
}
.pl-actions {
  display: flex; gap: 8px;
}
.pl-action {
  flex: 1;
  padding: 14px;
  border-radius: 14px;
  background: var(--glass-bg-strong);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 0.5px solid var(--glass-border);
  box-shadow: 0 1px 0 rgba(255,255,255,0.1) inset, 0 8px 20px -8px rgba(0,0,0,0.4);
  color: #fff;
  font-weight: 600;
  font-size: 16px;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  transition: transform .15s ease, background .15s ease;
}
.pl-action:active { background: var(--glass-bg-thicker); transform: scale(0.97); }
.pl-action .icon-play { border-left-color: var(--accent-2); }
.pl-action.is-primary { color: var(--accent-2); }
.icon-play { width:0; height:0; border-left:11px solid currentColor; border-top:7px solid transparent; border-bottom:7px solid transparent; margin-left:2px; }
.icon-shuffle { font-size: 16px; line-height: 1; font-weight: 700; }

/* tracklist */
.tracklist { padding: 8px 20px 16px; }
.track {
  display: grid;
  grid-template-columns: 24px 1fr auto;
  align-items: center;
  gap: 12px;
  padding: 14px 0;
  border-bottom: 0.5px solid var(--line);
  cursor: pointer;
  transition: background .15s ease;
}
.track:active { background: rgba(255,255,255,0.04); }
.track:last-child { border-bottom: none; }
.track-num {
  font-size: 16px;
  color: var(--fg-dim);
  text-align: center;
  font-variant-numeric: tabular-nums;
}
.track.is-current .track-num {
  color: var(--accent-2);
}
.track-info { min-width: 0; }
.track-title {
  font-size: 16px;
  color: var(--fg);
  font-weight: 500;
  letter-spacing: -0.01em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.track.is-current .track-title { color: var(--accent-2); }
.track-artist {
  font-size: 14px;
  color: var(--fg-muted);
  margin-top: 1px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.track-note {
  font-size: 12px;
  color: var(--fg-dim);
  margin-top: 6px;
  line-height: 1.45;
  font-style: italic;
}
.track-more {
  width: 28px; height: 28px;
  display: grid; place-items: center;
  color: var(--fg-dim);
  font-size: 20px;
  letter-spacing: 0;
}

/* equalizer (mini bars for now playing) */
.eq {
  display: inline-flex; gap: 2px; align-items: flex-end;
  width: 14px; height: 14px;
  margin: 0 auto;
}
.eq span {
  width: 2.5px; background: var(--accent-2); border-radius: 1px;
  animation: eq 0.9s ease-in-out infinite;
}
.eq span:nth-child(1) { animation-delay: 0s; height: 60%; }
.eq span:nth-child(2) { animation-delay: 0.2s; height: 90%; }
.eq span:nth-child(3) { animation-delay: 0.4s; height: 70%; }
@keyframes eq {
  0%, 100% { transform: scaleY(0.4); }
  50% { transform: scaleY(1); }
}

/* ============================================================
   mini player (floating)
   ============================================================ */
.mini {
  position: fixed;
  bottom: calc(16px + var(--safe-bottom));
  left: 50%;
  transform: translateX(-50%) translateY(140px);
  width: calc(100% - 16px);
  max-width: 424px;
  background: var(--glass-bg-thicker);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 0.5px solid var(--glass-border);
  border-radius: 18px;
  padding: 10px 12px;
  display: grid;
  grid-template-columns: 44px 1fr 36px 36px;
  gap: 12px;
  align-items: center;
  z-index: 50;
  transition: transform .42s cubic-bezier(.32,.72,0,1);
  box-shadow: var(--glass-shadow);
}
.mini.is-visible { transform: translateX(-50%) translateY(0); }
.mini-art {
  width: 44px; height: 44px;
  border-radius: 6px; overflow: hidden;
  background: #222;
  position: relative;
}
.mini-art img { width: 100%; height: 100%; object-fit: cover; display: block; }
.mini-art .mini-spin {
  position: absolute; inset: 0;
  background: rgba(0,0,0,0.5);
  display: none;
  align-items: center; justify-content: center;
}
.mini-art .mini-spin.is-visible { display: flex; }
.mini-art .mini-spin::after {
  content: ""; width: 18px; height: 18px;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.2);
  border-top-color: #fff;
  animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.mini-info { min-width: 0; }
.mini-title {
  font-size: 14px; font-weight: 500;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  letter-spacing: -0.01em;
}
.mini-artist {
  font-size: 12px; color: var(--fg-muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  margin-top: 1px;
}
.mini-btn {
  width: 36px; height: 36px;
  display: grid; place-items: center;
  color: #fff;
  font-size: 18px;
}
.mini-btn:active { opacity: 0.6; }
.mini-icon { display: inline-block; }
.icon-pause {
  width: 14px; height: 16px;
  position: relative;
}
.icon-pause::before, .icon-pause::after {
  content: ""; position: absolute; top: 0; bottom: 0;
  width: 4px; background: currentColor; border-radius: 1px;
}
.icon-pause::before { left: 1px; }
.icon-pause::after { right: 1px; }
.icon-play-sm {
  width: 0; height: 0;
  border-left: 13px solid currentColor;
  border-top: 8px solid transparent;
  border-bottom: 8px solid transparent;
  margin-left: 3px;
}
.icon-next {
  width: 18px; height: 14px;
  position: relative;
}
.icon-next::before {
  content: ""; position: absolute; left: 0; top: 0;
  width: 0; height: 0;
  border-left: 11px solid currentColor;
  border-top: 7px solid transparent;
  border-bottom: 7px solid transparent;
}
.icon-next::after {
  content: ""; position: absolute; right: 0; top: 0;
  width: 3px; height: 14px; background: currentColor; border-radius: 1px;
}
.mini-progress {
  position: absolute;
  bottom: 0; left: 12px; right: 12px;
  height: 2px;
  background: rgba(255,255,255,0.1);
  border-radius: 999px;
  overflow: hidden;
}
.mini-progress > span {
  display: block; height: 100%;

<script>
/* ============================================================
   helpers
   ============================================================ */
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const pick = a => a[Math.floor(Math.random()*a.length)];
const sample = (a, n) => {
  const c = [...a], o = [];
  for (let i = 0; i < n && c.length; i++) o.push(c.splice(Math.floor(Math.random()*c.length), 1)[0]);
  return o;
};

function toast(msg, ms = 2200) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("is-visible");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove("is-visible"), ms);
}

/* 시스템 프롬프트와 모델 선택 로직은 서버(/api/gemini)로 옮겨졌습니다. */

/* ============================================================
   state
   ============================================================ */
const state = {
  file: null,
  dataUrl: null,
  genre: null,
  mood: { energy: 0.3, chill: 0.8, acousticness: 0.6 },
  tracks: [],
  currentIndex: -1,
  isPlaying: false,
  videoIdCache: JSON.parse(localStorage.getItem("moodmix.videoCache") || "{}"),
  currentCandidates: [],
  lastResult: null,
};

/* ============================================================
   dropzone & file
   ============================================================ */
const dz = $("#dropzone");
dz.addEventListener("click", () => $("#file-input").click());
$("#file-input").addEventListener("change", e => {
  if (e.target.files[0]) handleFile(e.target.files[0]);
});
["dragenter","dragover"].forEach(ev => dz.addEventListener(ev, e => e.preventDefault()));
dz.addEventListener("drop", e => {
  e.preventDefault();
  if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
});

function handleFile(file) {
  if (!file.type.startsWith("image/")) return;
  state.file = file;
  const reader = new FileReader();
  reader.onload = async () => {
    state.dataUrl = reader.result;
    let img = dz.querySelector("img.preview");
    if (!img) { img = document.createElement("img"); img.className = "preview"; dz.appendChild(img); }
    img.src = state.dataUrl;
    dz.classList.add("has-image");

    // 1) 슬라이더 unlock
    $("#mood-card").classList.remove("is-locked");
    $$("#mood-card input[type=range]").forEach(el => el.removeAttribute("disabled"));

    // 2) 사진 색감 기반 자동 추정
    try {
      const m = await analyzeMoodFromImage(state.dataUrl);
      setEnergy(m.energy);
      setChill(m.chill);
      setAcoustic(m.acousticness);
    } catch (_) {}

    refreshCTA();
  };
  reader.readAsDataURL(file);
}

/* 업로드 사진은 클 수 있으니 GPT 전송용으로 리사이즈 + JPEG 압축 */
function resizeForUpload(dataUrl, maxSize = 768, quality = 0.85) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(maxSize / img.width, maxSize / img.height, 1);
      const w = Math.round(img.width * scale);
      const h = Math.round(img.height * scale);
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      c.getContext("2d").drawImage(img, 0, 0, w, h);
      resolve(c.toDataURL("image/jpeg", quality));
    };
    img.src = dataUrl;
  });
}

/* ============================================================
   genres & sliders
   ============================================================ */
$$("#genres .genre").forEach(b => {
  b.addEventListener("click", () => {
    $$("#genres .genre").forEach(x => x.classList.remove("is-active"));
    b.classList.add("is-active");
    state.genre = b.dataset.genre;
    refreshCTA();
  });
});

function bindSlider(id, key) {
  const el = $("#" + id);
  const val = $("#" + id + "-val");
  const applyFromValue = () => {
    state.mood[key] = parseInt(el.value, 10) / 100;
    val.style.opacity = (0.3 + state.mood[key] * 0.7).toFixed(2);
    val.style.transform = `scale(${(0.85 + state.mood[key] * 0.3).toFixed(2)})`;
    el.style.setProperty("--p", el.value + "%");
  };
  el.addEventListener("input", applyFromValue);
  applyFromValue();
  return (v) => {
    const clamped = Math.max(0, Math.min(1, v));
    el.value = String(Math.round(clamped * 100));
    applyFromValue();
  };
}
const setEnergy   = bindSlider("m-energy", "energy");
const setChill    = bindSlider("m-chill", "chill");
const setAcoustic = bindSlider("m-acoustic", "acousticness");

/* 사진 색감/광원 기반으로 분위기 슬라이더 자동 추정 */
function analyzeMoodFromImage(dataUrl) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const size = 64;
      const c = document.createElement("canvas");
      c.width = size; c.height = size;
      const ctx = c.getContext("2d");
      ctx.drawImage(img, 0, 0, size, size);
      const data = ctx.getImageData(0, 0, size, size).data;
      let bright = 0, sat = 0, warm = 0;
      const n = size * size;
      for (let i = 0; i < data.length; i += 4) {
        const r = data[i], g = data[i+1], b = data[i+2];
        const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
        bright += (r + g + b) / 3 / 255;
        sat    += mx === 0 ? 0 : (mx - mn) / mx;
        warm   += (r - b) / 255;
      }
      const avgB = bright / n;   // 0~1
      const avgS = sat / n;      // 0~1
      const avgW = warm / n;     // -1~1

      const energy = Math.max(0.1, Math.min(0.95, avgB * 0.55 + avgS * 0.55));
      const chill  = Math.max(0.1, Math.min(0.95, 0.5 + (-avgW) * 0.35 + (1 - avgB) * 0.35 - avgS * 0.15));
      const acoust = Math.max(0.15, Math.min(0.95, 0.45 + (1 - avgS) * 0.45 + (avgW > 0 ? avgW * 0.15 : 0)));
      resolve({ energy, chill, acousticness: acoust });
    };
    img.onerror = () => resolve({ energy: 0.5, chill: 0.5, acousticness: 0.5 });
    img.src = dataUrl;
  });
}

function refreshCTA() {
  $("#generate").disabled = !(state.file && state.genre);
}

/* ============================================================
   nav (scroll-aware navbars)
   ============================================================ */
function bindScrollNav(viewSel, navSel, titleEl, titleText) {
  const view = $(viewSel);
  const nav = $(navSel);
  view.addEventListener("scroll", () => {
    if (view.scrollTop > 80) nav.classList.add("is-scrolled");
    else nav.classList.remove("is-scrolled");
  });
}
bindScrollNav("#view-studio", "#nav-studio");
bindScrollNav("#view-playlist", "#nav-playlist");

/* ============================================================
   generate
   ============================================================ */
const loader = $("#loader");
// 누적 시간 기준 (ms) — 마지막 단계는 끝까지 그대로 유지됨
const loaderSteps = [
  { at: 0,     text: "이미지를 분석하고 있어요…" },
  { at: 3000,  text: "색감과 광원을 살피는 중…" },
  { at: 5500,  text: "사진의 분위기를 해석하는 중…" },
  { at: 8000,  text: "장르에 맞는 곡을 떠올리는 중…" },
  { at: 11000, text: "큐레이션 노트를 다듬는 중…" },
  { at: 15000, text: "거의 다 됐어요…" },
];

function startLoaderSequence() {
  $("#loader-text").textContent = loaderSteps[0].text;
  const timers = loaderSteps.slice(1).map(step =>
    setTimeout(() => { $("#loader-text").textContent = step.text; }, step.at)
  );
  return () => timers.forEach(clearTimeout);
}

$("#generate").addEventListener("click", async () => {
  if ($("#generate").disabled) return;

  loader.classList.add("is-visible");
  const stopLoader = startLoaderSequence();

  try {
    const resized = await resizeForUpload(state.dataUrl, 768, 0.85);
    const result = await generateWithGemini(resized);
    stopLoader();
    loader.classList.remove("is-visible");
    state.lastResult = result;
    applyResult(result);
    showPlaylist();
  } catch (e) {
    stopLoader();
    loader.classList.remove("is-visible");
    console.error(e);
    toast(`생성 실패: ${e.message}`, 3500);
  }
});

/* ============================================================
   /api/gemini — 서버 프록시 호출 (키는 Cloudflare env에 저장)
   ============================================================ */
async function generateWithGemini(imageDataUrl) {
  const res = await fetch("/api/gemini", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      dataUrl: imageDataUrl,
      genre: state.genre,
      mood: state.mood,
    }),
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error?.message || `HTTP ${res.status}`);
  }
  return res.json();
}

function applyResult(r) {
  const meta = r.ui_metadata || {};
  const log  = r.image_log || {};
  const list = Array.isArray(r.tracklist) ? r.tracklist : [];

  state.tracks = list.map(t => ({
    title: t.title || "—",
    artist: t.artist || "—",
    note: t.curator_note || "",
    duration: t.duration || "0:00",
  }));
  state.currentIndex = -1;
  state.isPlaying = false;

  const title = meta.playlist_title || "오늘의 무드";
  $("#pl-title").textContent = title;
  $("#nav-pl-title").textContent = title;
  $("#pl-desc").textContent = meta.description || log.scene_analysis || "";
  $("#hero-bg").style.backgroundImage = `url("${state.dataUrl}")`;

  const tags = Array.isArray(meta.vibe_tags) ? meta.vibe_tags : [];
  $("#pl-tags").innerHTML = tags.map(t => `<span class="pl-tag">${escapeHtml(t)}</span>`).join("");

  const colors = Array.isArray(log.detected_colors) ? log.detected_colors : [];
  const tint = colors[0] || "#2a2a2c";
  document.documentElement.style.setProperty("--tint", tint);

  const totalSec = state.tracks.reduce((s, t) => {
    const parts = (t.duration || "0:00").split(":").map(Number);
    return s + (parts[0] || 0) * 60 + (parts[1] || 0);
  }, 0);
  $("#pl-meta").textContent = `${state.tracks.length}곡 · ${Math.round(totalSec / 60)}분`;

  renderTracks();
  $("#view-playlist").scrollTop = 0;
}

function renderTracks() {
  $("#tracklist").innerHTML = state.tracks.map((t, i) => {
    const isCurrent = i === state.currentIndex;
    const numHtml = isCurrent && state.isPlaying
      ? `<span class="eq"><span></span><span></span><span></span></span>`
      : `${i + 1}`;
    return `
      <div class="track ${isCurrent ? 'is-current' : ''}" data-i="${i}">
        <div class="track-num">${numHtml}</div>
        <div class="track-info">
          <div class="track-title">${escapeHtml(t.title)}</div>
          <div class="track-artist">${escapeHtml(t.artist)}</div>
          <div class="track-note">${escapeHtml(t.note)}</div>
        </div>
        <button class="track-more" aria-label="More">⋯</button>
      </div>
    `;
  }).join("");
  $$("#tracklist .track").forEach(el => {
    el.addEventListener("click", () => playTrack(parseInt(el.dataset.i, 10)));
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

/* ============================================================
   navigation
   ============================================================ */
function showPlaylist() { $("#app").classList.add("show-playlist"); }
function showStudio()   { $("#app").classList.remove("show-playlist"); }
$("#back-btn").addEventListener("click", showStudio);

/* ============================================================
   playlist actions
   ============================================================ */
$("#play-all").addEventListener("click", () => playTrack(0));
$("#shuffle").addEventListener("click", () => {
  state.tracks = sample(state.tracks, state.tracks.length);
  renderTracks();
  playTrack(0);
});

/* ============================================================
   Share — 플레이리스트를 1080x1920 카드 이미지로 만들어 시스템 공유
   ============================================================ */

function loadImg(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

/* "cover"처럼 비율 유지 + 영역 가득 채우기 */
function drawCover(ctx, img, x, y, w, h) {
  const ir = img.width / img.height;
  const tr = w / h;
  let sx = 0, sy = 0, sw = img.width, sh = img.height;
  if (ir > tr) {
    sw = img.height * tr;
    sx = (img.width - sw) / 2;
  } else {
    sh = img.width / tr;
    sy = (img.height - sh) / 2;
  }
  ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
}

/* 텍스트를 maxWidth로 줄바꿈하면서 그리기. 마지막 y 반환 */
function drawWrappedText(ctx, text, x, y, maxWidth, lineHeight, maxLines = 3) {
  const words = String(text).split(/(\s+)/);
  let line = "";
  let lines = [];
  for (const w of words) {
    const test = line + w;
    if (ctx.measureText(test).width > maxWidth && line) {
      lines.push(line.trim());
      line = w.trim() + " ";
    } else {
      line = test;
    }
  }
  if (line) lines.push(line.trim());
  if (lines.length > maxLines) {
    lines = lines.slice(0, maxLines);
    let last = lines[maxLines - 1];
    while (ctx.measureText(last + "…").width > maxWidth && last.length > 1) {
      last = last.slice(0, -1);
    }
    lines[maxLines - 1] = last + "…";
  }
  lines.forEach((ln, i) => ctx.fillText(ln, x, y + i * lineHeight));
  return y + lines.length * lineHeight;
}

function ellipsize(ctx, text, maxWidth) {
  let s = String(text);
  if (ctx.measureText(s).width <= maxWidth) return s;
  while (s.length > 1 && ctx.measureText(s + "…").width > maxWidth) s = s.slice(0, -1);
  return s + "…";
}

async function generateShareCard() {
  const W = 1080, H = 1920;
  const canvas = document.createElement("canvas");
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext("2d");

  // 1. 검정 베이스
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, W, H);

  // 2. 사진을 위쪽 ~58%에 cover
  const photoH = Math.round(H * 0.62);
  try {
    const img = await loadImg(state.dataUrl);
    drawCover(ctx, img, 0, 0, W, photoH);
  } catch (_) {}

  // 3. 사진 위 미묘한 그라데이션 (상단·하단)
  const topGrad = ctx.createLinearGradient(0, 0, 0, 280);
  topGrad.addColorStop(0, "rgba(0,0,0,0.45)");
  topGrad.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = topGrad;
  ctx.fillRect(0, 0, W, 280);

  // 4. 사진 → 검정으로 부드러운 fade (mask 효과를 그라데이션으로 재현)
  const fadeStart = Math.round(photoH * 0.55);
  const fadeEnd = photoH + 60;
  const fadeGrad = ctx.createLinearGradient(0, fadeStart, 0, fadeEnd);
  fadeGrad.addColorStop(0, "rgba(0,0,0,0)");
  fadeGrad.addColorStop(0.7, "rgba(0,0,0,0.85)");
  fadeGrad.addColorStop(1, "rgba(0,0,0,1)");
  ctx.fillStyle = fadeGrad;
  ctx.fillRect(0, fadeStart, W, fadeEnd - fadeStart);

  // 5. 컨텐츠 영역
  const PAD = 70;
  let y = photoH + 20;

  const r = state.lastResult?.ui_metadata || {};
  const title = r.playlist_title || "내 Moodmix 플레이리스트";
  const tags  = Array.isArray(r.vibe_tags) ? r.vibe_tags.slice(0, 3) : [];

  // eyebrow
  ctx.fillStyle = "rgba(255,255,255,0.6)";
  ctx.font = `700 22px -apple-system, "SF Pro Text", "Pretendard", system-ui, sans-serif`;
  ctx.fillText("M O O D M I X   ·   A I  P L A Y L I S T", PAD, y);
  y += 50;

  // title (최대 3줄)
  ctx.fillStyle = "#ffffff";
  ctx.font = `800 78px -apple-system, "SF Pro Display", "Pretendard", system-ui, sans-serif`;
  y = drawWrappedText(ctx, title, PAD, y + 56, W - PAD * 2, 86, 3) + 12;

  // tags
  if (tags.length) {
    ctx.font = `500 26px -apple-system, "SF Pro Text", "Pretendard", system-ui, sans-serif`;
    let tx = PAD;
    const ty = y + 30;
    for (const tag of tags) {
      const tw = ctx.measureText(tag).width + 36;
      const th = 50;
      // 글래스 칩
      ctx.fillStyle = "rgba(255,255,255,0.12)";
      const rad = 25;
      ctx.beginPath();
      ctx.moveTo(tx + rad, ty);
      ctx.arcTo(tx + tw, ty,        tx + tw, ty + th, rad);
      ctx.arcTo(tx + tw, ty + th,   tx,      ty + th, rad);
      ctx.arcTo(tx,      ty + th,   tx,      ty,      rad);
      ctx.arcTo(tx,      ty,        tx + tw, ty,      rad);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.textBaseline = "middle";
      ctx.fillText(tag, tx + 18, ty + th / 2);
      ctx.textBaseline = "alphabetic";
      tx += tw + 10;
      if (tx > W - PAD - 100) break;
    }
    y = ty + th + 36;
  }

  // tracks (최대 5)
  const trackCount = Math.min(5, state.tracks.length);
  for (let i = 0; i < trackCount; i++) {
    const t = state.tracks[i];

    // 번호
    ctx.fillStyle = "rgba(255,255,255,0.45)";
    ctx.font = `500 24px -apple-system, "SF Pro Text", "Pretendard", system-ui, sans-serif`;
    ctx.fillText(String(i + 1).padStart(2, "0"), PAD, y + 30);

    // 제목
    ctx.fillStyle = "#fff";
    ctx.font = `600 30px -apple-system, "SF Pro Text", "Pretendard", system-ui, sans-serif`;
    ctx.fillText(ellipsize(ctx, t.title, W - PAD * 2 - 60), PAD + 60, y + 26);

    // 아티스트
    ctx.fillStyle = "rgba(255,255,255,0.6)";
    ctx.font = `400 24px -apple-system, "SF Pro Text", "Pretendard", system-ui, sans-serif`;
    ctx.fillText(ellipsize(ctx, t.artist, W - PAD * 2 - 60), PAD + 60, y + 60);

    y += 92;
  }

  if (state.tracks.length > trackCount) {
    ctx.fillStyle = "rgba(255,255,255,0.5)";
    ctx.font = `500 24px -apple-system, "SF Pro Text", "Pretendard", system-ui, sans-serif`;
    ctx.fillText(`외 ${state.tracks.length - trackCount}곡`, PAD + 60, y + 16);
  }

  // 푸터: 좌측 로고 도트 + 좌측 텍스트, 우측 URL
  const footY = H - 90;

  // 핑크 그라데이션 로고 dot
  const dotR = 16;
  const dotG = ctx.createLinearGradient(PAD - dotR, footY - dotR, PAD + dotR, footY + dotR);
  dotG.addColorStop(0, "#fa233b");
  dotG.addColorStop(1, "#ff8a5c");
  ctx.fillStyle = dotG;
  ctx.beginPath();
  ctx.arc(PAD + dotR, footY, dotR, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#fff";
  ctx.font = `700 30px -apple-system, "SF Pro Display", "Pretendard", system-ui, sans-serif`;
  ctx.fillText("Moodmix", PAD + dotR * 2 + 14, footY + 10);

  ctx.fillStyle = "rgba(255,255,255,0.6)";
  ctx.font = `500 24px -apple-system, "SF Pro Text", "Pretendard", system-ui, sans-serif`;
  ctx.textAlign = "right";
  ctx.fillText("moodmix-ai.pages.dev", W - PAD, footY + 10);
  ctx.textAlign = "left";

  return new Promise(resolve => canvas.toBlob(resolve, "image/png", 0.95));
}

$("#share-btn-nav").addEventListener("click", async () => {
  if (!state.tracks.length) {
    toast("플레이리스트를 먼저 만들어주세요");
    return;
  }

  toast("공유 카드 만드는 중…", 1500);

  let blob;
  try {
    blob = await generateShareCard();
  } catch (e) {
    console.error(e);
    toast(`이미지 생성 실패: ${e.message}`);
    return;
  }

  const r = state.lastResult?.ui_metadata;
  const title = r?.playlist_title || "내 Moodmix 플레이리스트";
  const url   = "https://moodmix-ai.pages.dev";
  const text  = `${title} — Moodmix에서 만들어보기`;
  const file  = new File([blob], "moodmix-playlist.png", { type: "image/png" });

  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file], title, text, url });
    } catch (e) {
      if (e.name !== "AbortError") toast(`공유 실패: ${e.message}`, 3000);
    }
    return;
  }

  // fallback: 다운로드
  const dlUrl = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = dlUrl;
  a.download = "moodmix-playlist.png";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(dlUrl), 1000);
  toast("이미지를 다운로드했어요");
});

/* ============================================================
   YouTube IFrame Player
   ============================================================ */
let ytPlayer = null;
let ytReady = false;

(function loadYTApi() {
  const s = document.createElement("script");
  s.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(s);
})();

window.onYouTubeIframeAPIReady = function () {
  ytPlayer = new YT.Player("yt-player", {
    height: "1",
    width: "1",
    playerVars: {
      autoplay: 0,
      controls: 0,
      modestbranding: 1,
      playsinline: 1,
      rel: 0,
    },
    events: {
      onReady: () => { ytReady = true; },
      onStateChange: handlePlayerState,
      onError: handlePlayerError,
    }
  });
};

async function searchYouTubeTopic(artist, title) {
  const cacheKey = `${artist}|${title}`;
  if (state.videoIdCache[cacheKey]) {
    state.currentCandidates = [];
    return state.videoIdCache[cacheKey];
  }

  let res;
  try {
    res = await fetch("/api/youtube", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ artist, title }),
    });
  } catch (e) {
    toast(`네트워크 오류: ${e.message}`, 3500);
    return null;
  }

  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    const msg = err.error?.message || `HTTP ${res.status}`;
    console.error("[moodmix] YT proxy error:", msg);
    toast(`검색 실패: ${msg.slice(0, 80)}`, 4000);
    return null;
  }

  const data = await res.json();
  const ids = data.videoIds || [];
  console.log(`[moodmix] "${artist} ${title}" → ${ids.length} candidates`);
  if (!ids.length) return null;

  state.videoIdCache[cacheKey] = ids[0];
  state.currentCandidates = ids.slice(1);
  localStorage.setItem("moodmix.videoCache", JSON.stringify(state.videoIdCache));
  return ids[0];
}

async function playTrack(i) {
  if (i < 0 || i >= state.tracks.length) return;

  state.currentIndex = i;
  const t = state.tracks[i];

  // mini player UI
  $("#mini").classList.add("is-visible");
  $("#mini-title").textContent = t.title;
  $("#mini-artist").textContent = t.artist;
  $("#mini-art-img").src = state.dataUrl;
  $("#mini-spin").classList.add("is-visible");
  $("#icon-playpause").className = "icon-pause";
  state.isPlaying = true;
  renderTracks();

  const videoId = await searchYouTubeTopic(t.artist, t.title);
  $("#mini-spin").classList.remove("is-visible");

  if (!videoId) {
    toast(`'${t.artist} - ${t.title}' 검색 결과 없음`, 3000);
    // 다음 곡으로 자동 진행
    if (i < state.tracks.length - 1) {
      setTimeout(() => playTrack(i + 1), 1200);
    }
    return;
  }

  if (ytReady && ytPlayer) {
    try {
      ytPlayer.loadVideoById(videoId);
    } catch (e) {
      console.error("loadVideo error:", e);
    }
  } else {
    // YT API 아직 로딩 중 → 잠시 후 재시도
    setTimeout(() => {
      if (ytReady && ytPlayer) ytPlayer.loadVideoById(videoId);
    }, 500);
  }
}

function handlePlayerState(e) {
  if (!window.YT) return;
  if (e.data === YT.PlayerState.ENDED) {
    if (state.currentIndex < state.tracks.length - 1) {
      playTrack(state.currentIndex + 1);
    } else {
      state.isPlaying = false;
      $("#icon-playpause").className = "icon-play-sm";
      renderTracks();
    }
  } else if (e.data === YT.PlayerState.PLAYING) {
    state.isPlaying = true;
    $("#icon-playpause").className = "icon-pause";
    $("#mini-spin").classList.remove("is-visible");
    renderTracks();
  } else if (e.data === YT.PlayerState.PAUSED) {
    state.isPlaying = false;
    $("#icon-playpause").className = "icon-play-sm";
    renderTracks();
  } else if (e.data === YT.PlayerState.BUFFERING) {
    $("#mini-spin").classList.add("is-visible");
  }
}

function handlePlayerError(e) {
  console.error("YT error", e?.data);

  // 1) 같은 곡의 다음 후보 영상 시도
  if (state.currentCandidates.length > 0) {
    const next = state.currentCandidates.shift();
    console.log("[moodmix] retry with fallback id:", next);
    try { ytPlayer.loadVideoById(next); } catch (_) {}
    return;
  }

  // 2) 후보 다 떨어짐 → 캐시에 저장된 게 임베드 안 되는 영상일 수 있으니 캐시 무효화
  const t = state.tracks[state.currentIndex];
  if (t) {
    delete state.videoIdCache[`${t.artist}|${t.title}`];
    localStorage.setItem("moodmix.videoCache", JSON.stringify(state.videoIdCache));
  }

  toast("재생 불가 — 다음 곡으로");
  if (state.currentIndex < state.tracks.length - 1) {
    setTimeout(() => playTrack(state.currentIndex + 1), 800);
  }
}

/* mini controls */
$("#mini-playpause").addEventListener("click", () => {
  if (!ytPlayer) return;
  if (state.isPlaying) ytPlayer.pauseVideo();
  else ytPlayer.playVideo();
});
$("#mini-next").addEventListener("click", () => {
  if (state.currentIndex < state.tracks.length - 1) {
    playTrack(state.currentIndex + 1);
  } else {
    toast("마지막 곡입니다");
  }
});

/* progress tick */
setInterval(() => {
  if (!ytPlayer || !ytReady || !state.isPlaying) return;
  try {
    const cur = ytPlayer.getCurrentTime();
    const dur = ytPlayer.getDuration();
    if (dur > 0) {
      $("#mini-progress-bar").style.width = ((cur / dur) * 100) + "%";
    }
  } catch (e) {}
}, 500);
</script>
