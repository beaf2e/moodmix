<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Moodmix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
/* ============================================================
   tokens (Apple Music dark)
   ============================================================ */
:root {
  --bg: #000;
  --bg-2: #0c0c0c;
  --surface: #1c1c1e;
  --surface-2: #2c2c2e;
  --line: rgba(255,255,255,0.08);
  --line-strong: rgba(255,255,255,0.14);
  --fg: #ffffff;
  --fg-muted: #98989e;
  --fg-dim: #6c6c70;
  --accent: #fa233b;
  --accent-2: #fb5c74;
  --gradient: linear-gradient(135deg, #fa233b 0%, #fb5c74 100%);
  --gradient-strong: linear-gradient(135deg, #ff2d55 0%, #ff5c8a 50%, #ff8a5c 100%);
  --r-sm: 10px;
  --r: 14px;
  --r-lg: 22px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Pretendard Variable", Pretendard, system-ui, "Helvetica Neue", sans-serif;
  --shadow-card: 0 24px 60px -20px rgba(0,0,0,0.6);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin:0; padding:0; height:100%; background:#000; }
body {
  font-family: var(--font);
  color: var(--fg);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
input { font: inherit; }

/* ============================================================
   app shell — phone-like
   ============================================================ */
.app {
  position: relative;
  width: 100%;
  max-width: 440px;
  height: 100dvh;
  margin: 0 auto;
  background: var(--bg);
  overflow: hidden;
  box-shadow: 0 0 80px rgba(0,0,0,0.6);
}

/* views */
.view {
  position: absolute;
  inset: 0;
  background: var(--bg);
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  transition: transform .42s cubic-bezier(.32,.72,0,1), opacity .42s ease;
  padding-bottom: calc(96px + var(--safe-bottom));
  will-change: transform;
}
.view-studio { z-index: 1; transform: translateX(0); }
.view-playlist { z-index: 2; transform: translateX(100%); }
.app.show-playlist .view-studio { transform: translateX(-22%); opacity: .35; }
.app.show-playlist .view-playlist { transform: translateX(0); }

/* nav bar */
.navbar {
  position: sticky; top: 0;
  display: flex; align-items: center;
  height: calc(44px + var(--safe-top));
  padding: var(--safe-top) 8px 0;
  z-index: 20;
  background: rgba(0,0,0,0);
  transition: background .25s ease, backdrop-filter .25s ease, border-color .25s ease;
  border-bottom: 0.5px solid transparent;
}
.navbar.is-scrolled {
  background: rgba(20,20,22,0.72);
  backdrop-filter: saturate(180%) blur(24px);
  -webkit-backdrop-filter: saturate(180%) blur(24px);
  border-bottom-color: var(--line);
}
.nav-btn {
  width: 44px; height: 44px;
  display: grid; place-items: center;
  color: var(--accent-2);
}
.nav-back-icon {
  width: 12px; height: 22px;
  border-left: 2.5px solid currentColor;
  border-bottom: 2.5px solid currentColor;
  transform: rotate(45deg);
  margin-left: 6px;
}
.nav-back-label {
  font-size: 17px;
  font-weight: 400;
  color: var(--accent-2);
  margin-left: -6px;
  letter-spacing: -0.02em;
}
.nav-title {
  flex: 1;
  text-align: center;
  font-size: 17px;
  font-weight: 600;
  letter-spacing: -0.02em;
  opacity: 0;
  transform: translateY(4px);
  transition: opacity .25s ease, transform .25s ease;
}
.navbar.is-scrolled .nav-title { opacity: 1; transform: none; }
.nav-spacer { width: 60px; }
.nav-action {
  width: 44px; height: 44px;
  display: grid; place-items: center;
  color: var(--accent-2);
  font-size: 22px;
}

/* ============================================================
   studio view
   ============================================================ */
.studio-pad { padding: 4px 20px 32px; }
.tag-eyebrow {
  font-size: 12px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--accent-2);
  font-weight: 700;
  margin: 8px 0 6px;
}
.hero-title {
  font-size: 34px;
  font-weight: 700;
  line-height: 1.08;
  letter-spacing: -0.025em;
  margin: 0 0 8px;
}
.hero-title .alt { color: var(--fg-muted); display: block; }
.hero-sub {
  font-size: 15px;
  color: var(--fg-muted);
  line-height: 1.5;
  margin: 0 0 24px;
}

/* dropzone */
.dropzone {
  position: relative;
  aspect-ratio: 1/1;
  width: 100%;
  border-radius: var(--r-lg);
  background: var(--surface);
  overflow: hidden;
  display: grid; place-items: center;
  cursor: pointer;
  transition: transform .2s ease;
}
.dropzone:active { transform: scale(0.99); }
.dropzone.has-image .dz-inner { display: none; }
.dropzone img.preview {
  position: absolute; inset: 0;
  width: 100%; height: 100%; object-fit: cover; display: block;
}
.dz-inner {
  display: flex; flex-direction: column; align-items: center; gap: 12px;
}
.dz-icon {
  width: 56px; height: 56px; border-radius: 50%;
  background: rgba(255,255,255,0.08);
  display: grid; place-items: center;
  position: relative;
}
.dz-icon::before, .dz-icon::after {
  content: ""; position: absolute; background: #fff; border-radius: 2px;
}
.dz-icon::before { width: 22px; height: 2.5px; }
.dz-icon::after { width: 2.5px; height: 22px; }
.dz-title { color: var(--fg); font-size: 15px; font-weight: 500; }
.dz-hint { color: var(--fg-muted); font-size: 13px; margin-top: -6px; }

/* section heading */
.section-h {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.02em;
  margin: 32px 0 12px;
}

/* genre chips */
.genres {
  display: flex; gap: 8px;
  overflow-x: auto;
  margin: 0 -20px;
  padding: 4px 20px 8px;
  scrollbar-width: none;
}
.genres::-webkit-scrollbar { display: none; }
.genre {
  flex-shrink: 0;
  padding: 10px 18px;
  border-radius: 999px;
  background: var(--surface);
  color: var(--fg);
  font-size: 14px;
  font-weight: 500;
  white-space: nowrap;
  transition: transform .15s ease;
}
.genre:active { transform: scale(0.96); }
.genre.is-active {
  background: var(--gradient);
  color: #fff;
  font-weight: 600;
}

/* mood sliders */
.mood-card {
  background: var(--surface);
  border-radius: var(--r);
  padding: 6px 16px;
  margin-top: 4px;
}
.mood-row {
  display: grid;
  grid-template-columns: 86px 1fr 40px;
  align-items: center;
  gap: 12px;
  padding: 12px 0;
}
.mood-row + .mood-row { border-top: 0.5px solid var(--line); }
.mood-row label { font-size: 14px; color: var(--fg); }
.mood-row .val { font-size: 13px; color: var(--fg-dim); text-align: right; font-variant-numeric: tabular-nums; }
input[type=range] {
  -webkit-appearance: none; appearance: none;
  width: 100%; height: 4px;
  border-radius: 999px;
  background: linear-gradient(to right, var(--accent-2) var(--p, 50%), rgba(255,255,255,0.15) var(--p, 50%));
  outline: none;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 18px; height: 18px;
  border-radius: 50%;
  background: #fff;
  cursor: pointer;
  box-shadow: 0 2px 6px rgba(0,0,0,0.4);
}

/* CTA */
.cta {
  width: 100%;
  padding: 16px;
  border-radius: 14px;
  background: var(--gradient);
  color: #fff;
  font-weight: 600;
  font-size: 17px;
  letter-spacing: -0.01em;
  margin-top: 32px;
  box-shadow: 0 10px 30px -10px rgba(250,35,59,0.55);
  transition: transform .15s ease, opacity .15s ease;
}
.cta:active:not(:disabled) { transform: scale(0.98); }
.cta:disabled {
  background: var(--surface);
  color: var(--fg-dim);
  box-shadow: none;
}

/* ============================================================
   playlist view
   ============================================================ */
.pl-hero {
  position: relative;
  padding: 24px 20px 24px;
  margin-top: calc(-44px - var(--safe-top));
  padding-top: calc(72px + var(--safe-top));
  background:
    radial-gradient(120% 80% at 50% 0%, var(--tint, #2a2a2c) 0%, rgba(0,0,0,0) 70%),
    linear-gradient(180deg, var(--tint, #2a2a2c) 0%, var(--bg) 100%);
  text-align: center;
}
.pl-cover {
  width: 240px; aspect-ratio: 1/1;
  margin: 8px auto 22px;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 30px 60px -20px rgba(0,0,0,0.8), 0 0 0 0.5px rgba(255,255,255,0.08);
  background: var(--surface);
}
.pl-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pl-title {
  font-size: 26px;
  font-weight: 700;
  letter-spacing: -0.025em;
  line-height: 1.15;
  margin: 0 0 6px;
}
.pl-byline {
  font-size: 14px;
  color: var(--accent-2);
  font-weight: 600;
  margin-bottom: 12px;
  letter-spacing: -0.01em;
}
.pl-desc {
  font-size: 15px;
  color: var(--fg-muted);
  line-height: 1.5;
  margin: 0 auto 16px;
  max-width: 340px;
}
.pl-tags { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin-bottom: 20px; }
.pl-tag {
  font-size: 12px;
  padding: 5px 11px;
  border-radius: 999px;
  background: rgba(255,255,255,0.1);
  color: #fff;
  font-weight: 500;
}
.pl-actions {
  display: flex; gap: 8px;
  max-width: 360px;
  margin: 0 auto;
}
.pl-action {
  flex: 1;
  padding: 13px;
  border-radius: 11px;
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(20px);
  color: var(--accent-2);
  font-weight: 600;
  font-size: 16px;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.pl-action:active { background: rgba(255,255,255,0.16); }
.icon-play { width:0; height:0; border-left:11px solid currentColor; border-top:7px solid transparent; border-bottom:7px solid transparent; margin-left:2px; }
.icon-shuffle { font-size: 16px; line-height: 1; font-weight: 700; }

/* tracklist */
.tracklist { padding: 8px 20px 16px; }
.track {
  display: grid;
  grid-template-columns: 24px 1fr auto;
  align-items: center;
  gap: 12px;
  padding: 14px 0;
  border-bottom: 0.5px solid var(--line);
  cursor: pointer;
  transition: background .15s ease;
}
.track:active { background: rgba(255,255,255,0.04); }
.track:last-child { border-bottom: none; }
.track-num {
  font-size: 16px;
  color: var(--fg-dim);
  text-align: center;
  font-variant-numeric: tabular-nums;
}
.track.is-current .track-num {
  color: var(--accent-2);
}
.track-info { min-width: 0; }
.track-title {
  font-size: 16px;
  color: var(--fg);
  font-weight: 500;
  letter-spacing: -0.01em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.track.is-current .track-title { color: var(--accent-2); }
.track-artist {
  font-size: 14px;
  color: var(--fg-muted);
  margin-top: 1px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.track-note {
  font-size: 12px;
  color: var(--fg-dim);
  margin-top: 6px;
  line-height: 1.45;
  font-style: italic;
}
.track-more {
  width: 28px; height: 28px;
  display: grid; place-items: center;
  color: var(--fg-dim);
  font-size: 20px;
  letter-spacing: 0;
}

/* equalizer (mini bars for now playing) */
.eq {
  display: inline-flex; gap: 2px; align-items: flex-end;
  width: 14px; height: 14px;
  margin: 0 auto;
}
.eq span {
  width: 2.5px; background: var(--accent-2); border-radius: 1px;
  animation: eq 0.9s ease-in-out infinite;
}
.eq span:nth-child(1) { animation-delay: 0s; height: 60%; }
.eq span:nth-child(2) { animation-delay: 0.2s; height: 90%; }
.eq span:nth-child(3) { animation-delay: 0.4s; height: 70%; }
@keyframes eq {
  0%, 100% { transform: scaleY(0.4); }
  50% { transform: scaleY(1); }
}

/* ============================================================
   mini player (floating)
   ============================================================ */
.mini {
  position: fixed;
  bottom: calc(16px + var(--safe-bottom));
  left: 50%;
  transform: translateX(-50%) translateY(140px);
  width: calc(100% - 16px);
  max-width: 424px;
  background: rgba(36,36,38,0.78);
  backdrop-filter: blur(30px) saturate(180%);
  -webkit-backdrop-filter: blur(30px) saturate(180%);
  border: 0.5px solid rgba(255,255,255,0.1);
  border-radius: 16px;
  padding: 10px 12px;
  display: grid;
  grid-template-columns: 44px 1fr 36px 36px;
  gap: 12px;
  align-items: center;
  z-index: 50;
  transition: transform .42s cubic-bezier(.32,.72,0,1);
  box-shadow: 0 20px 50px -10px rgba(0,0,0,0.5);
}
.mini.is-visible { transform: translateX(-50%) translateY(0); }
.mini-art {
  width: 44px; height: 44px;
  border-radius: 6px; overflow: hidden;
  background: #222;
  position: relative;
}
.mini-art img { width: 100%; height: 100%; object-fit: cover; display: block; }
.mini-art .mini-spin {
  position: absolute; inset: 0;
  background: rgba(0,0,0,0.5);
  display: none;
  align-items: center; justify-content: center;
}
.mini-art .mini-spin.is-visible { display: flex; }
.mini-art .mini-spin::after {
  content: ""; width: 18px; height: 18px;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.2);
  border-top-color: #fff;
  animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.mini-info { min-width: 0; }
.mini-title {
  font-size: 14px; font-weight: 500;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  letter-spacing: -0.01em;
}
.mini-artist {
  font-size: 12px; color: var(--fg-muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  margin-top: 1px;
}
.mini-btn {
  width: 36px; height: 36px;
  display: grid; place-items: center;
  color: #fff;
  font-size: 18px;
}
.mini-btn:active { opacity: 0.6; }
.mini-icon { display: inline-block; }
.icon-pause {
  width: 14px; height: 16px;
  position: relative;
}
.icon-pause::before, .icon-pause::after {
  content: ""; position: absolute; top: 0; bottom: 0;
  width: 4px; background: currentColor; border-radius: 1px;
}
.icon-pause::before { left: 1px; }
.icon-pause::after { right: 1px; }
.icon-play-sm {
  width: 0; height: 0;
  border-left: 13px solid currentColor;
  border-top: 8px solid transparent;
  border-bottom: 8px solid transparent;
  margin-left: 3px;
}
.icon-next {
  width: 18px; height: 14px;
  position: relative;
}
.icon-next::before {
  content: ""; position: absolute; left: 0; top: 0;
  width: 0; height: 0;
  border-left: 11px solid currentColor;
  border-top: 7px solid transparent;
  border-bottom: 7px solid transparent;
}
.icon-next::after {
  content: ""; position: absolute; right: 0; top: 0;
  width: 3px; height: 14px; background: currentColor; border-radius: 1px;
}
.mini-progress {
  position: absolute;
  bottom: 0; left: 12px; right: 12px;
  height: 2px;
  background: rgba(255,255,255,0.1);
  border-radius: 999px;
  overflow: hidden;
}
.mini-progress > span {
  display: block; height: 100%;
  background: #fff;
  width: 0%;
  transition: width .25s linear;
}

/* ============================================================
   loader & modal
   ============================================================ */
.loader {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.9);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  display: none;
  flex-direction: column; align-items: center; justify-content: center;
  gap: 24px;
  z-index: 100;
}
.loader.is-visible { display: flex; }
.loader-ring {
  width: 48px; height: 48px;
  border-radius: 50%;
  border: 3px solid rgba(255,255,255,0.1);
  border-top-color: var(--accent-2);
  animation: spin 1s linear infinite;
}
.loader-text {
  font-size: 16px;
  color: var(--fg-muted);
  text-align: center;
  letter-spacing: -0.01em;
  min-height: 22px;
}

.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.55);
  display: none;
  align-items: flex-end; justify-content: center;
  z-index: 150;
  animation: fadeIn .25s ease;
}
.modal-overlay.is-visible { display: flex; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  width: 100%; max-width: 440px;
  background: #1c1c1e;
  border-radius: 22px 22px 0 0;
  padding: 8px 20px calc(28px + var(--safe-bottom));
  animation: slideUp .35s cubic-bezier(.32,.72,0,1);
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal-handle {
  width: 36px; height: 5px;
  background: rgba(255,255,255,0.25);
  border-radius: 99px;
  margin: 0 auto 16px;
}
.modal h2 {
  margin: 0 0 8px;
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.02em;
}
.modal p {
  color: var(--fg-muted);
  font-size: 14px;
  line-height: 1.5;
  margin: 0 0 16px;
}
.modal p a { color: var(--accent-2); text-decoration: none; }
.settings-label {
  display: block;
  font-size: 13px;
  color: var(--fg);
  font-weight: 500;
  margin: 14px 0 6px;
  letter-spacing: -0.01em;
}
.settings-label span {
  color: var(--fg-dim);
  font-weight: 400;
  margin-left: 6px;
}
.modal input {
  width: 100%;
  padding: 14px 16px;
  background: #2c2c2e;
  border: 0;
  border-radius: 12px;
  color: #fff;
  font-size: 15px;
  margin-bottom: 4px;
  outline: none;
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
}
.modal-actions { display: flex; gap: 8px; }
.modal-btn {
  flex: 1;
  padding: 14px;
  border-radius: 12px;
  background: var(--surface-2);
  color: var(--fg);
  font-weight: 500;
  font-size: 16px;
}
.modal-btn.primary {
  background: var(--gradient);
  color: #fff;
  font-weight: 600;
}

/* hidden YT iframe */
#yt-player-wrap {
  position: fixed;
  width: 1px; height: 1px;
  top: -1000px; left: -1000px;
  opacity: 0; pointer-events: none;
}

/* toast */
.toast {
  position: fixed;
  bottom: calc(100px + var(--safe-bottom));
  left: 50%;
  transform: translateX(-50%) translateY(40px);
  background: rgba(40,40,42,0.92);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  color: #fff;
  padding: 12px 18px;
  border-radius: 999px;
  font-size: 14px;
  opacity: 0;
  pointer-events: none;
  z-index: 200;
  transition: opacity .3s ease, transform .3s ease;
  max-width: calc(100% - 40px);
  white-space: nowrap;
}
.toast.is-visible { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="app" id="app">

  <!-- ===================== STUDIO VIEW ===================== -->
  <div class="view view-studio" id="view-studio">
    <div class="navbar" id="nav-studio">
      <div class="nav-spacer"></div>
      <div class="nav-title">Moodmix</div>
      <div class="nav-spacer"></div>
    </div>

    <div class="studio-pad">
      <div class="tag-eyebrow">AI Curator</div>
      <h1 class="hero-title">
        사진으로 만드는
        <span class="alt">나만의 플레이리스트</span>
      </h1>
      <p class="hero-sub">사진을 추가하고 장르를 고르면, AI가 색감과 분위기에 맞는 곡을 골라드려요.</p>

      <label class="dropzone" id="dropzone" for="file-input">
        <input type="file" id="file-input" accept="image/*" hidden>
        <div class="dz-inner">
          <div class="dz-icon" aria-hidden="true"></div>
          <div class="dz-title">사진 추가</div>
          <div class="dz-hint">JPG · PNG · HEIC</div>
        </div>
      </label>

      <div class="section-h">장르</div>
      <div class="genres" id="genres">
        <button class="genre" data-genre="K-Indie">K-Indie</button>
        <button class="genre" data-genre="J-Pop">J-Pop</button>
        <button class="genre" data-genre="K-Pop">K-Pop</button>

  <!-- ===================== PLAYLIST VIEW ===================== -->

</div>

<!-- mini player -->
<div class="mini" id="mini" role="region" aria-label="Now playing">
  <div class="mini-art">
    <img id="mini-art-img" alt="">
    <div class="mini-spin" id="mini-spin"></div>
  </div>
  <div class="mini-info">
    <div class="mini-title" id="mini-title">—</div>
    <div class="mini-artist" id="mini-artist">—</div>
  </div>
  <button class="mini-btn" id="mini-playpause" aria-label="Play/Pause">
    <span class="icon-pause" id="icon-playpause"></span>
  </button>
  <button class="mini-btn" id="mini-next" aria-label="Next">
    <span class="icon-next"></span>
  </button>
  <div class="mini-progress"><span id="mini-progress-bar"></span></div>
</div>

<!-- loader -->
<div class="loader" id="loader">
  <div class="loader-ring"></div>
  <div class="loader-text" id="loader-text">이미지를 듣고 있어요…</div>
</div>


<!-- toast -->
<div class="toast" id="toast">메시지</div>

<!-- hidden YT iframe -->
<div id="yt-player-wrap"><div id="yt-player"></div></div>

<script>
/* ============================================================
   helpers
   ============================================================ */
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const pick = a => a[Math.floor(Math.random()*a.length)];
const sample = (a, n) => {
  const c = [...a], o = [];
  for (let i = 0; i < n && c.length; i++) o.push(c.splice(Math.floor(Math.random()*c.length), 1)[0]);
  return o;
};

function toast(msg, ms = 2200) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("is-visible");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove("is-visible"), ms);
}

/* 시스템 프롬프트와 모델 선택 로직은 서버(/api/gemini)로 옮겨졌습니다. */

/* ============================================================
   state
   ============================================================ */
const state = {
  file: null,
  dataUrl: null,
  genre: null,
  mood: { energy: 0.3, chill: 0.8, acousticness: 0.6 },
  tracks: [],
  currentIndex: -1,
  isPlaying: false,
  videoIdCache: JSON.parse(localStorage.getItem("moodmix.videoCache") || "{}"),
  currentCandidates: [],
  lastResult: null,
};

/* ============================================================
   dropzone & file
   ============================================================ */
const dz = $("#dropzone");
dz.addEventListener("click", () => $("#file-input").click());
$("#file-input").addEventListener("change", e => {
  if (e.target.files[0]) handleFile(e.target.files[0]);
});
["dragenter","dragover"].forEach(ev => dz.addEventListener(ev, e => e.preventDefault()));
dz.addEventListener("drop", e => {
  e.preventDefault();
  if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
});

function handleFile(file) {
  if (!file.type.startsWith("image/")) return;
  state.file = file;
  const reader = new FileReader();
  reader.onload = () => {
    state.dataUrl = reader.result;
    let img = dz.querySelector("img.preview");
    if (!img) { img = document.createElement("img"); img.className = "preview"; dz.appendChild(img); }
    img.src = state.dataUrl;
    dz.classList.add("has-image");
    refreshCTA();
  };
  reader.readAsDataURL(file);
}

/* 업로드 사진은 클 수 있으니 GPT 전송용으로 리사이즈 + JPEG 압축 */
function resizeForUpload(dataUrl, maxSize = 768, quality = 0.85) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(maxSize / img.width, maxSize / img.height, 1);
      const w = Math.round(img.width * scale);
      const h = Math.round(img.height * scale);
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      c.getContext("2d").drawImage(img, 0, 0, w, h);
      resolve(c.toDataURL("image/jpeg", quality));
    };
    img.src = dataUrl;
  });
}

/* ============================================================
   genres & sliders
   ============================================================ */
$$("#genres .genre").forEach(b => {
  b.addEventListener("click", () => {
    $$("#genres .genre").forEach(x => x.classList.remove("is-active"));
    b.classList.add("is-active");
    state.genre = b.dataset.genre;
    refreshCTA();
  });
});

function bindSlider(id, key) {
  const el = $("#" + id);
  const val = $("#" + id + "-val");
  const update = () => {
    state.mood[key] = parseInt(el.value, 10) / 100;
    val.textContent = state.mood[key].toFixed(2);
    el.style.setProperty("--p", el.value + "%");
  };
  el.addEventListener("input", update);
  update();
}
bindSlider("m-energy", "energy");
bindSlider("m-chill", "chill");
bindSlider("m-acoustic", "acousticness");

function refreshCTA() {
  $("#generate").disabled = !(state.file && state.genre);
}

/* ============================================================
   nav (scroll-aware navbars)
   ============================================================ */
function bindScrollNav(viewSel, navSel, titleEl, titleText) {
  const view = $(viewSel);
  const nav = $(navSel);
  view.addEventListener("scroll", () => {
    if (view.scrollTop > 80) nav.classList.add("is-scrolled");
    else nav.classList.remove("is-scrolled");
  });
}
bindScrollNav("#view-studio", "#nav-studio");
bindScrollNav("#view-playlist", "#nav-playlist");

/* ============================================================
   generate
   ============================================================ */
const loader = $("#loader");
const loaderTexts = [
  "이미지를 보고 있어요…",
  "색감과 광원을 분석 중…",
  "장르에 맞는 곡을 고르는 중…",
  "큐레이션 노트를 다듬는 중…",
];

$("#generate").addEventListener("click", async () => {
  if ($("#generate").disabled) return;

  loader.classList.add("is-visible");
  let i = 0;
  $("#loader-text").textContent = loaderTexts[0];
  const timer = setInterval(() => {
    i = (i + 1) % loaderTexts.length;
    $("#loader-text").textContent = loaderTexts[i];
  }, 1800);

  try {
    const resized = await resizeForUpload(state.dataUrl, 768, 0.85);
    const result = await generateWithGemini(resized);
    clearInterval(timer);
    loader.classList.remove("is-visible");
    state.lastResult = result;
    applyResult(result);
    showPlaylist();
  } catch (e) {
    clearInterval(timer);
    loader.classList.remove("is-visible");
    console.error(e);
    toast(`생성 실패: ${e.message}`, 3500);
  }
});

/* ============================================================
   /api/gemini — 서버 프록시 호출 (키는 Cloudflare env에 저장)
   ============================================================ */
async function generateWithGemini(imageDataUrl) {
  const res = await fetch("/api/gemini", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      dataUrl: imageDataUrl,
      genre: state.genre,
      mood: state.mood,
    }),
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error?.message || `HTTP ${res.status}`);
  }
  return res.json();
}

function applyResult(r) {
  const meta = r.ui_metadata || {};
  const log  = r.image_log || {};
  const list = Array.isArray(r.tracklist) ? r.tracklist : [];

  state.tracks = list.map(t => ({
    title: t.title || "—",
    artist: t.artist || "—",
    note: t.curator_note || "",
    duration: t.duration || "0:00",
  }));
  state.currentIndex = -1;
  state.isPlaying = false;

  const title = meta.playlist_title || "오늘의 무드";
  $("#pl-title").textContent = title;
  $("#nav-pl-title").textContent = title;
  $("#pl-desc").textContent = meta.description || log.scene_analysis || "";
  $("#cover-img").src = state.dataUrl;

  const tags = Array.isArray(meta.vibe_tags) ? meta.vibe_tags : [];
  $("#pl-tags").innerHTML = tags.map(t => `<span class="pl-tag">${escapeHtml(t)}</span>`).join("");

  const colors = Array.isArray(log.detected_colors) ? log.detected_colors : [];
  const tint = colors[0] || "#2a2a2c";
  document.documentElement.style.setProperty("--tint", tint);

  const totalSec = state.tracks.reduce((s, t) => {
    const parts = (t.duration || "0:00").split(":").map(Number);
    return s + (parts[0] || 0) * 60 + (parts[1] || 0);
  }, 0);
  $("#pl-meta").textContent = `${state.tracks.length}곡 · ${Math.round(totalSec / 60)}분`;

  renderTracks();
  $("#view-playlist").scrollTop = 0;
}

function renderTracks() {
  $("#tracklist").innerHTML = state.tracks.map((t, i) => {
    const isCurrent = i === state.currentIndex;
    const numHtml = isCurrent && state.isPlaying
      ? `<span class="eq"><span></span><span></span><span></span></span>`
      : `${i + 1}`;
    return `
      <div class="track ${isCurrent ? 'is-current' : ''}" data-i="${i}">
        <div class="track-num">${numHtml}</div>
        <div class="track-info">
          <div class="track-title">${escapeHtml(t.title)}</div>
          <div class="track-artist">${escapeHtml(t.artist)}</div>
          <div class="track-note">${escapeHtml(t.note)}</div>
        </div>
        <button class="track-more" aria-label="More">⋯</button>
      </div>
    `;
  }).join("");
  $$("#tracklist .track").forEach(el => {
    el.addEventListener("click", () => playTrack(parseInt(el.dataset.i, 10)));
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

/* ============================================================
   navigation
   ============================================================ */
function showPlaylist() { $("#app").classList.add("show-playlist"); }
function showStudio()   { $("#app").classList.remove("show-playlist"); }
$("#back-btn").addEventListener("click", showStudio);

/* ============================================================
   playlist actions
   ============================================================ */
$("#play-all").addEventListener("click", () => playTrack(0));
$("#shuffle").addEventListener("click", () => {
  state.tracks = sample(state.tracks, state.tracks.length);
  renderTracks();
  playTrack(0);
});

/* ============================================================
   YouTube IFrame Player
   ============================================================ */
let ytPlayer = null;
let ytReady = false;

(function loadYTApi() {
  const s = document.createElement("script");
  s.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(s);
})();

window.onYouTubeIframeAPIReady = function () {
  ytPlayer = new YT.Player("yt-player", {
    height: "1",
    width: "1",
    playerVars: {
      autoplay: 0,
      controls: 0,
      modestbranding: 1,
      playsinline: 1,
      rel: 0,
    },
    events: {
      onReady: () => { ytReady = true; },
      onStateChange: handlePlayerState,
      onError: handlePlayerError,
    }
  });
};

async function searchYouTubeTopic(artist, title) {
  const cacheKey = `${artist}|${title}`;
  if (state.videoIdCache[cacheKey]) {
    state.currentCandidates = [];
    return state.videoIdCache[cacheKey];
  }

  let res;
  try {
    res = await fetch("/api/youtube", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ artist, title }),
    });
  } catch (e) {
    toast(`네트워크 오류: ${e.message}`, 3500);
    return null;
  }

  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    const msg = err.error?.message || `HTTP ${res.status}`;
    console.error("[moodmix] YT proxy error:", msg);
    toast(`검색 실패: ${msg.slice(0, 80)}`, 4000);
    return null;
  }

  const data = await res.json();
  const ids = data.videoIds || [];
  console.log(`[moodmix] "${artist} ${title}" → ${ids.length} candidates`);
  if (!ids.length) return null;

  state.videoIdCache[cacheKey] = ids[0];
  state.currentCandidates = ids.slice(1);
  localStorage.setItem("moodmix.videoCache", JSON.stringify(state.videoIdCache));
  return ids[0];
}

async function playTrack(i) {
  if (i < 0 || i >= state.tracks.length) return;

  state.currentIndex = i;
  const t = state.tracks[i];

  // mini player UI
  $("#mini").classList.add("is-visible");
  $("#mini-title").textContent = t.title;
  $("#mini-artist").textContent = t.artist;
  $("#mini-art-img").src = state.dataUrl;
  $("#mini-spin").classList.add("is-visible");
  $("#icon-playpause").className = "icon-pause";
  state.isPlaying = true;
  renderTracks();

  const videoId = await searchYouTubeTopic(t.artist, t.title);
  $("#mini-spin").classList.remove("is-visible");

  if (!videoId) {
    toast(`'${t.artist} - ${t.title}' 검색 결과 없음`, 3000);
    // 다음 곡으로 자동 진행
    if (i < state.tracks.length - 1) {
      setTimeout(() => playTrack(i + 1), 1200);
    }
    return;
  }

  if (ytReady && ytPlayer) {
    try {
      ytPlayer.loadVideoById(videoId);
    } catch (e) {
      console.error("loadVideo error:", e);
    }
  } else {
    // YT API 아직 로딩 중 → 잠시 후 재시도
    setTimeout(() => {
      if (ytReady && ytPlayer) ytPlayer.loadVideoById(videoId);
    }, 500);
  }
}

function handlePlayerState(e) {
  if (!window.YT) return;
  if (e.data === YT.PlayerState.ENDED) {
    if (state.currentIndex < state.tracks.length - 1) {
      playTrack(state.currentIndex + 1);
    } else {
      state.isPlaying = false;
      $("#icon-playpause").className = "icon-play-sm";
      renderTracks();
    }
  } else if (e.data === YT.PlayerState.PLAYING) {
    state.isPlaying = true;
    $("#icon-playpause").className = "icon-pause";
    $("#mini-spin").classList.remove("is-visible");
    renderTracks();
  } else if (e.data === YT.PlayerState.PAUSED) {
    state.isPlaying = false;
    $("#icon-playpause").className = "icon-play-sm";
    renderTracks();
  } else if (e.data === YT.PlayerState.BUFFERING) {
    $("#mini-spin").classList.add("is-visible");
  }
}

function handlePlayerError(e) {
  console.error("YT error", e?.data);

  // 1) 같은 곡의 다음 후보 영상 시도
  if (state.currentCandidates.length > 0) {
    const next = state.currentCandidates.shift();
    console.log("[moodmix] retry with fallback id:", next);
    try { ytPlayer.loadVideoById(next); } catch (_) {}
    return;
  }

  // 2) 후보 다 떨어짐 → 캐시에 저장된 게 임베드 안 되는 영상일 수 있으니 캐시 무효화
  const t = state.tracks[state.currentIndex];
  if (t) {
    delete state.videoIdCache[`${t.artist}|${t.title}`];
    localStorage.setItem("moodmix.videoCache", JSON.stringify(state.videoIdCache));
  }

  toast("재생 불가 — 다음 곡으로");
  if (state.currentIndex < state.tracks.length - 1) {
    setTimeout(() => playTrack(state.currentIndex + 1), 800);
  }
}

/* mini controls */
$("#mini-playpause").addEventListener("click", () => {
  if (!ytPlayer) return;
  if (state.isPlaying) ytPlayer.pauseVideo();
  else ytPlayer.playVideo();
});
$("#mini-next").addEventListener("click", () => {
  if (state.currentIndex < state.tracks.length - 1) {
    playTrack(state.currentIndex + 1);
  } else {
    toast("마지막 곡입니다");
  }
});

/* progress tick */
setInterval(() => {
  if (!ytPlayer || !ytReady || !state.isPlaying) return;
  try {
    const cur = ytPlayer.getCurrentTime();
    const dur = ytPlayer.getDuration();
    if (dur > 0) {
      $("#mini-progress-bar").style.width = ((cur / dur) * 100) + "%";
    }
  } catch (e) {}
}, 500);
</script>
